# pizza-hacking — do not run this file directly, use ./pizza.sh.
#
# pizza.sh generates the per-event parts into $PIZZA_STATE_DIR and layers them
# on top of this file:
#   .env                                  every generated credential
#   certs/                                local CA + wildcard certificate
#   generated/docker-compose.players.yml  one Juice Shop per player, each on
#                                         its own internal network that only
#                                         Traefik joins
#   generated/traefik/dynamic.yml         routers, forward-auth, TLS
#   generated/tinyauth/{config.yml,users} accounts + per-host ACLs (deny)
#   generated/challenges-meta.json        hints exported from Juice Shop
#
# Nothing here mounts the docker socket.
name: pizza-hacking

x-hardening: &hardening
  restart: unless-stopped
  pids_limit: 1024
  security_opt:
    - no-new-privileges:true

services:
  traefik:
    <<: *hardening
    image: traefik:v3.7.16
    command: --configFile=/etc/traefik/traefik.yml
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${PIZZA_STATE_DIR:?run ./pizza.sh}/generated/traefik:/etc/traefik/dynamic:ro
      - ${PIZZA_STATE_DIR}/certs:/certs:ro
    networks:
      - edge

  tinyauth:
    <<: *hardening
    image: ghcr.io/tinyauthapp/tinyauth:v5.2.0
    command: --configfile=/config/config.yml
    volumes:
      - ${PIZZA_STATE_DIR}/generated/tinyauth:/config:ro
      - tinyauth-data:/data
    networks:
      - edge

  # juice.<domain>: sends each logged-in player to their own instance.
  landing:
    <<: *hardening
    image: nginx:1.27-alpine
    environment:
      DOMAIN: ${DOMAIN}
      PORT_SUFFIX: ${PORT_SUFFIX:-}
    volumes:
      - ./landing/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - edge

  ctfd:
    <<: *hardening
    image: ctfd/ctfd:3.8.9
    environment:
      DATABASE_URL: mysql+pymysql://ctfd:${CTFD_DB_PASSWORD}@ctfd-db/ctfd
      REDIS_URL: redis://ctfd-cache:6379
      SECRET_KEY: ${CTFD_SECRET_KEY}
      UPLOAD_FOLDER: /var/uploads
      LOG_FOLDER: /var/log/CTFd
      REVERSE_PROXY: "true"
      WORKERS: "2"
    volumes:
      - ctfd-uploads:/var/uploads
    # CTFd's entrypoint waits for the database by itself.
    depends_on:
      - ctfd-db
      - ctfd-cache
    networks:
      - edge
      - backend

  ctfd-db:
    <<: *hardening
    image: mariadb:11.4
    command: [mariadbd, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800]
    environment:
      MARIADB_ROOT_PASSWORD: ${CTFD_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ctfd
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ${CTFD_DB_PASSWORD}
    volumes:
      - ctfd-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend

  ctfd-cache:
    <<: *hardening
    image: redis:7-alpine
    networks:
      - backend

  # One-shot: finishes CTFd setup and imports the Juice Shop challenges.
  ctfd-bootstrap:
    image: python:3.12-slim
    profiles: [tools]
    restart: "no"
    pids_limit: 256
    command: python -I /bootstrap/ctfd_import.py
    environment:
      CTFD_URL: http://ctfd:8000
      JUICE_URL: http://juice-player1:3000
      CTF_KEY: ${CTF_KEY}
      CTF_NAME: ${CTF_NAME:-Pizza Hacking}
      CTFD_ADMIN_USER: ${CTFD_ADMIN_USER}
      CTFD_ADMIN_EMAIL: ${CTFD_ADMIN_EMAIL}
      CTFD_ADMIN_PASSWORD: ${CTFD_ADMIN_PASSWORD}
      HINT_COST_PERCENT: ${HINT_COST_PERCENT:-10}
      JUICE_PUBLIC_URL: https://juice.${DOMAIN}${PORT_SUFFIX:-}
    volumes:
      - ./bootstrap:/bootstrap:ro
      - ${PIZZA_STATE_DIR}/generated/challenges-meta.json:/data/challenges-meta.json:ro

  # ./pizza.sh test — talks to the stack only through Traefik.
  tests:
    image: python:3.12-slim
    profiles: [test]
    restart: "no"
    pids_limit: 512
    working_dir: /tests
    entrypoint: ["sh", "-c", "pip install -q --disable-pip-version-check --root-user-action=ignore -r requirements.txt && exec python -m pytest \"$$@\"", "pytest"]
    environment:
      PIZZA_ENV_FILE: /state/.env
      PIZZA_CA: /state/certs/ca.crt
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./tests:/tests:ro
      - ${PIZZA_STATE_DIR}:/state:ro
      - pip-cache:/root/.cache/pip
    networks:
      - edge

networks:
  edge:
  backend:
    internal: true

volumes:
  tinyauth-data:
  ctfd-db:
  ctfd-uploads:
  pip-cache:
