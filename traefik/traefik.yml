# Static Traefik config. Routers, middlewares and the certificate are
# generated by pizza.sh into $PIZZA_STATE_DIR/traefik/dynamic.yml.
entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
    http:
      tls: {}
  # Plain HTTP and never published: for a reverse proxy in front of this
  # stack that terminates TLS itself (README, "Behind your own reverse
  # proxy"). Same routers, same tinyauth gate.
  proxy:
    address: ":8000"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: WARN

accessLog: {}

api:
  dashboard: false

global:
  checkNewVersion: false
  sendAnonymousUsage: false
